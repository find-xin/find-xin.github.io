<header class="hero" style="--hero-image:url('{{ site.Params.heroImage }}')">
  <nav class="top-nav" aria-label="主导航">
    <details class="mobile-menu"><summary aria-label="打开导航">☰</summary><div class="menu-panel">{{ partial "navlinks.html" . }}</div></details>
    <div class="desktop-links">{{ partial "navlinks.html" . }}</div>
  </nav>
  <a class="hero-title" href="{{ site.Home.RelPermalink }}"><span>{{ site.Params.heroTitle | default site.Title }}</span><small>{{ site.Params.heroSubtitle | default site.Params.description }}</small></a>
</header>
