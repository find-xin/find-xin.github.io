<!-- 全屏大图灯箱 (Lightbox) -->
<dialog class="lightbox" aria-label="相片欣赏">
  <div class="lightbox-top">
    <div class="lightbox-meta">
      <span class="lightbox-category-tag"></span>
      <span class="lightbox-count"></span>
    </div>
    <button class="lightbox-close" aria-label="关闭画作" autofocus>关闭 ×</button>
  </div>
  <div class="lightbox-stage">
    <img class="lightbox-image" alt="">
  </div>
  <div class="lightbox-bottom">
    <button class="lightbox-nav-btn lightbox-prev" aria-label="上一幅">← 上一幅</button>
    <div class="lightbox-center-info">
      <p class="lightbox-caption"></p>
      <div class="lightbox-sub-info">
        <span class="lightbox-tags-display"></span>
        <a class="lightbox-original" target="_blank" rel="noopener">查看原图 ↗</a>
      </div>
    </div>
    <button class="lightbox-nav-btn lightbox-next" aria-label="下一幅">下一幅 →</button>
  </div>
</dialog>
