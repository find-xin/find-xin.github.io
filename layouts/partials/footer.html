<footer class="footer site-footer">
  <div class="footer-horizon" aria-hidden="true">
    <div class="horizon-line"></div>
    <span class="horizon-symbol">✦</span>
    <div class="horizon-line"></div>
  </div>
  <div class="footer-inner shell">
    <div class="footer-brand">
      <div class="footer-brand-header">
        <span class="footer-sparkle" aria-hidden="true">✦</span>
        <a href="{{ site.Home.RelPermalink }}" class="footer-brand-title">{{ site.Title }}</a>
      </div>
      <p class="footer-motto">{{ site.Params.description | default "记录日常开发、项目实践与偶尔的型月时刻。" }}</p>
      <div class="footer-badge">
        <span class="footer-badge-dot" aria-hidden="true"></span>
        <span>已在时光中记录 <strong id="blog-days">1</strong> 天</span>
      </div>
    </div>
    <div class="footer-nav-grid">
      <div class="footer-nav-col">
        <span class="footer-nav-heading">探索</span>
        <div class="footer-links">
          <a href="{{ site.Home.RelPermalink }}">首页</a>
          <a href="{{ "diary/" | relURL }}">日常随笔 ✨</a>
          <a href="{{ "posts/" | relURL }}">文章归档</a>
          <a href="{{ "gallery/" | relURL }}">精选相册</a>
        </div>
      </div>
      <div class="footer-nav-col">
        <span class="footer-nav-heading">交流</span>
        <div class="footer-links">
          <a href="{{ site.Params.friendsURL | relURL }}">友人帐</a>
          <a href="{{ site.Params.guestbookURL | relURL }}">留言板</a>
          <a href="{{ site.Params.githubURL }}" target="_blank" rel="noopener">GitHub ↗</a>
          <a class="footer-rss" href="{{ "index.xml" | relURL }}" target="_blank" rel="noopener">RSS 订阅 ↗</a>
        </div>
      </div>
      <div class="footer-nav-col footer-col-quote">
        <span class="footer-nav-heading">星夜寄语</span>
        <p class="footer-quote-text">「魔法使之夜仍在继续，以字为痕，留住星空与灵感。」</p>
        <span class="footer-tech-tag">基于 Hugo 构建 · 托管于 GitHub Pages</span>
      </div>
    </div>
  </div>
  <div class="footer-bottom shell">
    <div class="footer-bottom-inner">
      <p class="footer-copyright">© {{ now.Year }} {{ site.Params.author }} · All rights reserved.</p>
      <p class="footer-tagline">「夜色静谧，愿代码与故事常伴」</p>
    </div>
  </div>
</footer>
