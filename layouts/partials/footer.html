<footer class="footer site-footer">
  <div class="footer-inner shell">
    <div class="footer-brand">
      <a href="{{ site.Home.RelPermalink }}" class="footer-brand-title">{{ site.Title }}</a>
      <span class="footer-sep">·</span>
      <span class="footer-copyright">© {{ now.Year }} {{ site.Params.author }} · 基于 Hugo 构建</span>
    </div>
    <nav class="footer-links" aria-label="页脚导航">
      <a href="{{ "posts/" | relURL }}">文章</a>
      <a href="{{ "diary/" | relURL }}">日记</a>
      <a href="{{ "archive/" | relURL }}">归档</a>
      <a href="{{ "gallery/" | relURL }}">相册</a>
      <a href="{{ "resources/" | relURL }}">资料库</a>
      <a href="{{ site.Params.friendsURL | relURL }}">友链</a>
      <a href="{{ site.Params.guestbookURL | relURL }}">留言</a>
      {{ with site.Params.githubURL }}<a href="{{ . }}" target="_blank" rel="noopener noreferrer">GitHub</a>{{ end }}
      <a class="footer-rss" href="{{ "index.xml" | relURL }}" target="_blank" rel="noopener noreferrer">RSS</a>
    </nav>
  </div>
</footer>
