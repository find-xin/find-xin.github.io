{{ define "main" }}
<section class="guestbook-page shell">
  <header class="page-heading">
    <p class="diary-eyebrow">MESSAGE & FEEDBACK</p>
    <h1>{{ .Title }}</h1>
    <p class="friends-subtitle">{{ .Description | default "在这里留下你的回音，聊聊文章，也聊聊最近读到的作品与感悟。" }}</p>
  </header>

  <div class="guestbook-container">
    <div class="guestbook-hero-card">
      <div class="guestbook-header-icon" aria-hidden="true">💌</div>
      <div class="post-content">
        {{ .Content }}
      </div>
    </div>
  </div>
</section>
{{ end }}
