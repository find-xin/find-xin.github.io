{{ define "main" }}
<section class="guestbook-page shell">
  <header class="page-header">
    <div class="page-header-top">
      <div>
        <p class="page-eyebrow">MESSAGE & FEEDBACK · 留言板</p>
        <h1 class="page-title">{{ .Title }}</h1>
        <p class="page-desc">{{ .Description | default "在这里留下你的回音，聊聊文章，也聊聊最近读到的作品与生活感悟。" }}</p>
      </div>
      <div class="page-stats-badge">
        <span>💌 交流与回音 · 期待你的声音</span>
      </div>
    </div>
  </header>

  <div class="guestbook-container">
    <div class="guestbook-hero-card">
      <div class="guestbook-header-icon" aria-hidden="true">💌</div>
      <div class="post-content">
        {{ .Content }}
      </div>
    </div>
    {{ partial "comments.html" . }}
  </div>
</section>
{{ end }}
