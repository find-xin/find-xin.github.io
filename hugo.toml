baseURL = 'https://find-xin.github.io/'
locale = 'zh-CN'
title = 'find-xin 的博客'

[params]
  description = '记录日常开发、项目实践与偶尔的型月时刻。'
  heroImage = '/images/gallery/collection-31.webp'
  heroTitle = 'find-xin 的博客'
  heroSubtitle = '记录日常开发、项目实践与偶尔的型月时刻。'
  diaryURL = '/diary/'
  friendsURL = '/friends/'
  guestbookURL = '/guestbook/'
  searchURL = '/search/'
  tagsURL = '/tags/'
  author = 'find-xin'
  avatar = '/images/avatar-github.jpg'
  githubURL = 'https://github.com/find-xin'
  math = true

[taxonomies]
  tag = 'tags'
  category = 'categories'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params.giscus]
  enable = true
  repo = "find-xin/find-xin.github.io"
  repoId = "R_kgDOUrmUfg"       # 前往 https://giscus.app 填写 GitHub 仓库后自动生成
  category = "Announcements"
  categoryId = "DIC_kwDOUrmUfs4DG0nm"   # 前往 https://giscus.app 选择分类后自动生成
  mapping = "pathname"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  lang = "zh-CN"

enableRobotsTXT = true

[minify]
  minifyOutput = true

[markup.goldmark.renderer]
  unsafe = false
  hardWraps = true

[markup.tableOfContents]
  startLevel = 1
  endLevel = 6
